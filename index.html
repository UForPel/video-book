<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="description" content="유튜브 영상과 시간대별 글을 함께 읽는 영상책">
  <title>영상책</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="영상책 홈"><span class="brand-mark">책</span><span>영상책</span></a>
      <span class="prototype-label">자막 실험 1</span>
    </header>
    <section class="intro">
      <p class="eyebrow">VIDEO BOOK</p>
      <h1>영상을 읽는 새로운 방법</h1>
      <p class="intro-copy">영상을 재생하면서 자막을 읽고, 문장을 눌러 해당 장면으로 이동할 수 있습니다.</p>
    </section>
    <section class="load-panel" aria-labelledby="load-title">
      <label id="load-title" for="video-url">유튜브 영상 주소 또는 영상 ID</label>
      <div class="load-row">
        <input id="video-url" type="url" inputmode="url" placeholder="https://youtu.be/..." autocomplete="off">
        <button id="load-video" type="button">불러오기</button>
      </div>
      <p id="status" class="status" role="status">영상 주소를 입력하고 불러오기를 눌러주세요.</p>
    </section>
    <section class="viewer" aria-label="영상 플레이어">
      <div id="player-placeholder" class="player-placeholder">
        <span class="play-symbol">▶</span><span>영상이 여기에 표시됩니다</span>
      </div>
      <div id="player"></div>
    </section>
    <section class="transcript-panel">
      <div class="section-heading">
        <div><p class="eyebrow">SYNCED TEXT</p><h2>시간대별 자막</h2></div>
        <span class="coming-soon">SRT · VTT</span>
      </div>
      <p id="transcript-hint" class="helper">자막 파일을 불러오면 영상과 함께 읽을 수 있습니다. 자막 파일은 이 브라우저 안에서만 읽으며 서버로 전송하지 않습니다.</p>
      <a id="youtube-transcript-link" class="youtube-transcript-link" href="#" target="_blank" rel="noopener noreferrer" hidden>YouTube에서 공식 대본 보기 ↗</a>
      <div class="subtitle-picker">
        <label for="subtitle-file">내 기기에서 자막 파일 선택</label>
        <input id="subtitle-file" type="file" accept=".srt,.vtt,text/vtt,application/x-subrip">
      </div>
      <div id="transcript" class="sample-lines" aria-live="polite"></div>
    </section>
    <footer>개인용 프로젝트 · 자막 파일 연결 시험</footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
